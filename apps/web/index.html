<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#242321" />
    <title>游城拓荒 · 第 105 号拓荒区</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        background: #242321;
      }
      .initial-entry {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 32px;
        text-align: center;
        color: #c2ad86;
        font: 12px sans-serif;
      }
      .initial-entry img {
        width: 210px;
        height: 105px;
        object-fit: contain;
        opacity: 0.8;
      }
      .initial-entry p {
        margin: 0;
      }
      .initial-entry a {
        color: #c2ad86;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-entry" role="status">
        <img src="/assets/official-arknights-logo.webp" alt="明日方舟" />
        <p>正在准备拓荒…</p>
        <noscript>请启用 JavaScript 后<a href="">重新载入</a>。</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
